services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: chat-manager-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      HOST: 0.0.0.0
      PORT: 8000
      SQLITE_PATH: /data/chat_manager.db
      TYPESENSE_URL: http://typesense:8108
      TYPESENSE_API_KEY: ${TYPESENSE_API_KEY:-localdevkey}
      TYPESENSE_COLLECTION: chat_messages
      TYPESENSE_MENU_COLLECTION: menu
    ports:
      - "127.0.0.1:${CHAT_MANAGER_PORT:-8000}:8000"
    volumes:
      - chat_manager_data:/data
    depends_on:
      - typesense
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  typesense:
    image: typesense/typesense:0.25.2
    container_name: chat-manager-typesense
    restart: unless-stopped
    command: '--data-dir /data --api-key=${TYPESENSE_API_KEY:-localdevkey} --enable-cors'
    ports:
      - "127.0.0.1:8108:8108"
    volumes:
      - typesense_data:/data

volumes:
  chat_manager_data:
  typesense_data:

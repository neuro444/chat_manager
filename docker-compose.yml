services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: chat-manager-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      HOST: 0.0.0.0
      PORT: 8000
      SQLITE_PATH: /data/chat_manager.db
    ports:
      - "127.0.0.1:${CHAT_MANAGER_PORT:-8000}:8000"
    volumes:
      - chat_manager_data:/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  chat_manager_data:
